<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Employee Management System</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a class="hover:underline" th:href="@{/}">Employee From</a></li>
                    <li><a class="hover:underline" th:href="@{/employeelist}">Employee List</a></li>
				
										
                </ul>
            </nav>
        </div>
    </header>
	
    <div class="container mx-auto mt-10">
        <h1 class="text-2xl font-bold mb-6">Update Employee Details</h1>
      
		
		
		<form action="#" th:action="@{/updateEmployee}" method="post" th:object="${employee}">
		           
				<div class="mb-4">
		               <label for="Employee Id" class="block text-gray-700 font-bold mb-2">Employee Id</label>
		               <input type="text" th:field="*{employeeid}" id="customerId" name="customerId" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Employee ID">
		           </div>
		         
				
				  <div class="mb-4">
		               <label for="Employee Name" class="block text-gray-700 font-bold mb-2">Employee Name</label>
		               <input type="text" th:field="*{employeename}" id="EmployeeName" name="EmployeeName" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Employee Name">
		           </div>
		         
				
				  <div class="mb-4">
		               <label for="position" class="block text-gray-700 font-bold mb-2">position</label>
		               <input type="position"  th:field="*{position}" id="position" name="position" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Position">
		           </div>
		         
				
				  <div class="mb-4">
		               <label for="department" class="block text-gray-700 font-bold mb-2">department</label>
		               <input type="text" th:feild="*{department}" id="department" name="department" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Demartment">
		           </div>
		         
				
				
				  <div class="mb-4">
		               <label for="salary" class="block text-gray-700 font-bold mb-2">Salary</label>
		               <input type="text" th:feild="*{salary}" id="salary" name="salary" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Salary">
		           </div>
		          
				
				
				 <div class="flex items-center justify-between">
		               <button type="submit" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-2 px-4 rounded-full focus:outline-none focus:shadow-outline transform transition hover:scale-105 duration-300 ease-in-out">
		                   Submit
		               </button>
		           </div>
		       </form>
		
		
    </div>
</body>
</html>
