<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <header class="bg-blue-600 text-white p-4 fixed top-0 left-0 w-full">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Employee Management System</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a class="hover:underline" th:href="@{/}">Employee Form</a></li>
                    <li><a class="hover:underline" th:href="@{/employeelist}">EmployeeList</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md mt-20">
        <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">Employee Form</h2>
       
        <form action="#" th:action="@{/}" method="post" th:object="${Employee}">
        
            <div class="mb-4">
                <label for="employeename" class="block text-gray-700 font-bold mb-2">Employee Name</label>
                <input type="text" th:field="*{employeename}" id="employeename" name="employeename" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter employee Name">
            </div>
            <div class="mb-4">
                <label for="position" class="block text-gray-700 font-bold mb-2">Position</label>
                <input type="text" th:field="*{position}" id="position" name="position" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Position">
            </div>
            <div class="mb-4">
                <label for="department" class="block text-gray-700 font-bold mb-2">Department</label>
                <input type="text" th:field="*{department}" id="department" name="department" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Department">
            </div>
            <div class="mb-4">
                <label for="salary" class="block text-gray-700 font-bold mb-2">Salary</label>
                <input type="text" th:field="*{salary}" id="salary" name="salary" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Enter Salary">
            </div>
            <div class="flex items-center justify-between">
                <button type="submit" class="bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 text-white font-bold py-2 px-4 rounded-full focus:outline-none focus:shadow-outline transform transition hover:scale-105 duration-300 ease-in-out">
                    Submit
                </button>
            </div>
        </form>
       
    </div>
</body>
</html>
