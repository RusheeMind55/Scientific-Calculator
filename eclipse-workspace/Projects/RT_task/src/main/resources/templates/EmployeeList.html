<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-600 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Employee Management System</h1>
            <nav>
                <ul class="flex space-x-4">
                    <li><a class="hover:underline" th:href="@{/}">Employee Form</a></li>
                    <li><a class="hover:underline" th:href="@{/employeelist}">Employee List</a></li>
				
                </ul>
            </nav>
        </div>
    </header>
    <div class="container mx-auto mt-10">
        <h1 class="text-2xl font-bold mb-6">Employee Table</h1>
        <table class="min-w-full bg-white">
            <thead>
                <tr>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">Employee ID</th>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">Employee Name</th>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">Position</th>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">department</th>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">Salary</th>
                    <th class="py-2 px-4 border-b-2 border-gray-300 text-left">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="e:${employeelist}">
                    <td th:text="${e.employeeid}" class="py-2 px-4 border-b border-gray-300"></td>
                    <td th:text="${e.employeename}" class="py-2 px-4 border-b border-gray-300"></td>
                    <td th:text="${e.position}" class="py-2 px-4 border-b border-gray-300"></td>
                    <td th:text="${e.department}" class="py-2 px-4 border-b border-gray-300"></td>
                    <td th:text="${e.salary}" class="py-2 px-4 border-b border-gray-300"></td>
                    <td class="py-2 px-4 border-b border-gray-300">
						
                        <a th:href="@{/updateEmployee/{id}(id=${e.employeeid})}">
                            <button class="bg-blue-500 text-white px-2 py-1 rounded mr-2">Update</button>
                        </a>
                        <a th:href="@{/deleteEmployee/{id}(id=${e.employeeid})}">
                            <button class="bg-red-500 text-white px-2 py-1 rounded">Delete</button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
